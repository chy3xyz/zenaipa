name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (zig build test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # build.zig.zon pins zent/zigmodu by git tag + content hash; Zig fetches
      # them directly, no sibling checkout needed.
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0-dev.1567+f0354179a
      - name: Zig format check
        run: zig fmt --check src/ build.zig
      - name: Zig build + tests
        run: zig build test --summary all

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
