name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (zig build test)
    runs-on: ubuntu-latest
    env:
      # mlugg/setup-zig@v1 builds old-pattern URLs (zig-<os>-<arch>) that 404
      # for current dev builds; download from ziglang.org directly using the
      # arch-first name (same fix as zigmodu CI). Old dev builds get
      # garbage-collected — bump ZIG_VERSION when this 404s again.
      ZIG_VERSION: 0.17.0-dev.1970+67f39b551
    steps:
      - uses: actions/checkout@v4
      # build.zig.zon pins zent/zigmodu by git tag + content hash; Zig fetches
      # them directly, no sibling checkout needed.
      - name: Setup Zig
        shell: bash
        run: |
          curl -fsSL "https://ziglang.org/builds/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
      - name: Zig format check
        run: zig fmt --check src/ build.zig
      - name: Zig build + tests
        run: zig build test --summary all

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
