name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (zig build test)
    runs-on: ubuntu-latest
    env:
      # 官方版直下，URL 与 Dockerfile 完全同构。/builds/ 只承载 dev 快照，
      # 正式版要走 /download/；mlugg/setup-zig 的 mirror 404、mirror:false
      # 拼官方 URL 报 Invalid URL（zweq 连续三轮 CI 实证），弃用该 action。
      ZIG_VERSION: 0.17.0
    steps:
      - uses: actions/checkout@v4
      # build.zig.zon pins zent/zigmodu by git tag + content hash; Zig fetches
      # them directly, no sibling checkout needed.
      - name: Setup Zig
        shell: bash
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Zig format check
        run: zig build lint-fmt
      - name: File size lint (≤1800 lines)
        run: zig build lint-size
      - name: Zig build + tests
        run: zig build test --summary all

  # 真实进程冒烟:关机 panic/泄漏门禁(单测看不见请求 arena 的 no-op free 泄漏)。
  e2e:
    name: E2E smoke + shutdown leak gate
    runs-on: ubuntu-latest
    needs: backend
    env:
      ZIG_VERSION: 0.17.0
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig
        shell: bash
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"
          echo "$RUNNER_TEMP/zig/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Build (debug, sqlite+postgres)
        run: zig build
      - name: E2E smoke
        run: scripts/run_e2e.sh

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # 生产依赖面审计（--omit=dev）：dev 链（vitest→tinypool）当前有需要
      # vitest@5 跨大版本才能消的通告，不在发布产物里，不作为发布门禁。
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
